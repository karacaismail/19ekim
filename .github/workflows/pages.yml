name: Kontrol ve yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Yayın yarıda kesilmesin: yeni çalışma, sürmekte olanın bitmesini bekler.
  cancel-in-progress: false

jobs:
  build:
    name: Kontrol, derleme ve tarayıcı testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tip, Astro ve UI kapısı
        run: npm run check
      - name: Üretim derlemesi
        run: npm run build
      - name: Playwright tarayıcıları
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Tarayıcı testleri (Chromium, Firefox, WebKit)
        run: npx playwright test
      - name: Test raporu
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
